name: Game-grade Vertical Slice Validation

on:
  push:
    branches:
      - codex/game-grade-experience-vertical-slice
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-only-secret-for-game-grade-validation
      APP_BASE_URL: http://localhost:3000
      LLM_MOCK_MODE: "true"
      HUB_COACH_TRUST_PROXY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare deterministic database
        run: npm run db:reset

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Game-grade Playwright slice
        run: npm run e2e -- tests/e2e/game-grade-vertical-slice.spec.ts

      - name: Full Playwright regression
        run: npm run e2e
